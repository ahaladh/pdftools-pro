# Reverse-proxy settings for the API (used by /api/ locations).
proxy_pass http://pdftools_api;
proxy_http_version 1.1;
proxy_set_header Connection "";                       # enables upstream keepalive
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;            # appears in API logs and nginx logs: one id per request end to end
proxy_read_timeout 330s;
proxy_send_timeout 330s;
proxy_connect_timeout 5s;
proxy_next_upstream off;                              # never replay a (possibly non-idempotent, large) upload on another instance
gzip off;                                             # API responses can carry tokens: no compression (BREACH)
