# JSON access log. Uses $uri (path only), NEVER $request_uri/$args: download links carry a signed token in the query string.
log_format pdftools_json escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time",'
  '"upstream_status":"$upstream_status","referer_host":"$http_host","user_agent":"$http_user_agent"}';
