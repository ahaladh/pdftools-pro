# Container config: serves the SPA and proxies /api to the `api` service over plain HTTP.
# TLS is terminated in FRONT of this container (cloud load balancer, Caddy, or the VPS template in this folder).
include /etc/nginx/snippets/pdftools-log-format.conf;
upstream pdftools_api { server api:4000; keepalive 32; }
limit_req_zone $binary_remote_addr zone=pdf_upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pdf_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pdf_api:10m rate=600r/m;
limit_req_status 429;

# This container sits BEHIND a TLS terminator (Caddy, a cloud load balancer or a host nginx), so every connection arrives from the
# proxy's address. Without the next lines, `limit_req` below would put ALL visitors into one bucket (one noisy client could
# rate-limit everyone) and the API would log/quota every visitor under one IP. Trust X-Forwarded-For only from private ranges
# (docker networks, loopback, RFC1918): a public client connecting directly cannot spoof it. Do NOT publish this container's port
# on a public interface without a proxy in front.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from ::1;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log /dev/stdout pdftools_json;
  error_log /dev/stderr warn;
  client_max_body_size 1m;
  client_body_timeout 120s;

  gzip on; gzip_vary on; gzip_min_length 1024; gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # (Security headers are added per static location below; proxied /api responses carry the API's own.)

  # Uploads: large bodies, streamed straight to the API, tight per-IP rate.
  location /api/pdf/ {
    limit_req zone=pdf_upload burst=20 nodelay;
    client_max_body_size 1g;                 # >= plan max file size x max files; the API enforces the real per-plan limits
    proxy_request_buffering off;
    include /etc/nginx/snippets/pdftools-api-proxy.conf;
  }
  location /api/auth/ {
    limit_req zone=pdf_auth burst=10 nodelay;
    include /etc/nginx/snippets/pdftools-api-proxy.conf;
  }
  location /api/ {
    limit_req zone=pdf_api burst=200 nodelay;
    include /etc/nginx/snippets/pdftools-api-proxy.conf;
  }
  # Uptime probe for external monitors (liveness only; /ready and /metrics are not exposed publicly).
  location = /healthz { access_log off; proxy_pass http://pdftools_api/health; proxy_http_version 1.1; proxy_set_header Connection ""; }

  location /assets/ {
    include /etc/nginx/snippets/pdftools-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location ~ /\. { deny all; }
  # Pages (including prerendered ones): always revalidate so a deploy takes effect at once.
  location / {
    include /etc/nginx/snippets/pdftools-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html /app-shell.html;   # prerendered page if one exists, else the pristine SPA shell
  }
}
